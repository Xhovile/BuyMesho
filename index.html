<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BuyMesho — Malawi's Secure E-commerce Platform</title>
    <meta
      name="description"
      content="BuyMesho is Malawi's secure e-commerce platform for discovering and buying products, services, and tickets from sellers across the country."
    />
    <meta name="application-name" content="BuyMesho" />
    <meta name="theme-color" content="#111827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BuyMesho" />
    <meta name="robots" content="index,follow" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://buymesho.app/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="BuyMesho" />
    <meta property="og:title" content="BuyMesho — Malawi's Secure E-commerce Platform" />
    <meta
      property="og:description"
      content="BuyMesho is Malawi's secure e-commerce platform for discovering and buying products, services, and tickets from sellers across the country."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://buymesho.app/" />
    <meta property="og:image" content="https://buymesho.app/Og-image.webp" />
    <meta property="og:image:alt" content="BuyMesho — Malawi's Secure E-commerce Platform" />
    <meta property="og:locale" content="en_MW" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BuyMesho — Malawi's Secure E-commerce Platform" />
    <meta
      name="twitter:description"
      content="BuyMesho is Malawi's secure e-commerce platform for discovering and buying products, services, and tickets from sellers across the country."
    />
    <meta name="twitter:image" content="https://buymesho.app/Og-image.webp" />
    <meta name="twitter:image:alt" content="BuyMesho — Malawi's Secure E-commerce Platform" />

    <script>
      (() => {
        const canonicalHost = "buymesho.app";
        const isLegacyHost = window.location.hostname === `www.${canonicalHost}`;
        const isLegacyHomePath = window.location.pathname === "/home";

        if (isLegacyHost || isLegacyHomePath) {
          const target = new URL(window.location.href);
          target.hostname = canonicalHost;
          if (isLegacyHomePath) target.pathname = "/";
          window.location.replace(target.toString());
          return;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
