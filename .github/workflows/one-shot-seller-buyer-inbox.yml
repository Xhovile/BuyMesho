name: One-shot seller buyer inbox

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply seller buyer-inbox scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/routes/messagesRoutes.ts')
          text = path.read_text()

          old = '''  const sellerScope = String(req.query.scope || "").trim().toLowerCase() === "seller";
  const whereClause = sellerScope
    ? "c.seller_uid = ? AND c.listing_id IS NOT NULL"
    : "c.buyer_uid = ? OR c.seller_uid = ? OR ? = 1";
  const params = sellerScope
    ? [user.uid]
    : [user.uid, user.uid, user.is_admin ? 1 : 0];
'''

          new = '''  const sellerScope = String(req.query.scope || "").trim().toLowerCase() === "seller";
  const isSeller = Boolean(
    db.prepare(`SELECT 1 FROM sellers WHERE uid = ? LIMIT 1`).get(user.uid)
  );
  const whereClause = sellerScope
    ? "c.seller_uid = ? AND c.listing_id IS NOT NULL"
    : isSeller
      ? "c.buyer_uid = ? AND c.seller_uid <> ?"
      : "c.buyer_uid = ? OR c.seller_uid = ? OR ? = 1";
  const params = sellerScope
    ? [user.uid]
    : isSeller
      ? [user.uid, user.uid]
      : [user.uid, user.uid, user.is_admin ? 1 : 0];
'''

          if old not in text:
              raise SystemExit('Expected seller inbox scope block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-seller-buyer-inbox.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/messagesRoutes.ts .github/workflows/one-shot-seller-buyer-inbox.yml
          git commit -m "Separate seller buyer inbox conversations [skip ci]"
          git push origin HEAD:main
