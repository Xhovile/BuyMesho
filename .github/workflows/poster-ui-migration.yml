name: Poster UI Migration

on:
  push:
    branches:
      - fix/event-card-checkout-fullscreen

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply poster UX
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/EventsCreatePage.tsx")
          text = path.read_text()

          old = '''  const handlePosterPick = () => posterInputRef.current?.click();\n\n  const handlePosterChange = async (e: ChangeEvent<HTMLInputElement>) => {'''
          new = '''  const handlePosterPick = () => posterInputRef.current?.click();\n\n  const handlePosterRemove = () => {\n    setPosterAssetUrl("");\n    setFormError(null);\n    if (posterInputRef.current) posterInputRef.current.value = "";\n  };\n\n  const handlePosterChange = async (e: ChangeEvent<HTMLInputElement>) => {'''
          if old not in text: raise SystemExit("poster handler anchor missing")
          text = text.replace(old, new, 1)

          old = '''        spec_values: {\n          ...normalizedValues,\n          ...(posterAssetUrl ? { poster_image_url: posterAssetUrl } : {}),\n        },'''
          new = '''        spec_values: {\n          ...normalizedValues,\n          poster_image_url: posterAssetUrl || null,\n        },'''
          if old not in text: raise SystemExit("poster payload anchor missing")
          text = text.replace(old, new, 1)

          old = '''                  <input ref={posterInputRef} type="file" accept="image/*" className="hidden" onChange={handlePosterChange} />\n                  {posterAssetUrl ? (\n                    <div className="mt-4 overflow-hidden rounded-[1.5rem] border border-zinc-200 bg-white">\n                      <img src={posterAssetUrl} alt="Poster preview" className="h-56 w-full object-cover" />\n                    </div>\n                  ) : ('''
          new = '''                  <input\n                    ref={posterInputRef}\n                    type="file"\n                    accept="image/*"\n                    multiple={false}\n                    className="hidden"\n                    onChange={handlePosterChange}\n                  />\n                  {posterAssetUrl ? (\n                    <div className="relative mt-4 overflow-hidden rounded-[1.5rem] border border-zinc-200 bg-white">\n                      <img src={posterAssetUrl} alt="Poster preview" className="h-56 w-full object-cover" />\n                      <button\n                        type="button"\n                        onClick={handlePosterRemove}\n                        disabled={posterUploading}\n                        aria-label="Remove poster"\n                        title="Remove poster"\n                        className="absolute right-3 top-3 inline-flex h-9 w-9 items-center justify-center rounded-full border border-white/30 bg-black/60 text-white shadow-lg backdrop-blur-sm transition hover:bg-black/75 disabled:cursor-not-allowed disabled:opacity-60"\n                      >\n                        <X className="h-4 w-4" />\n                      </button>\n                    </div>\n                  ) : ('''
          if old not in text: raise SystemExit("poster preview anchor missing")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Verify
        run: |
          test "$(grep -c 'multiple={false}' src/EventsCreatePage.tsx)" -eq 1
          test "$(grep -c 'const handlePosterRemove' src/EventsCreatePage.tsx)" -eq 1
          test "$(grep -c 'poster_image_url: posterAssetUrl || null' src/EventsCreatePage.tsx)" -eq 1
          test "$(grep -c 'aria-label=\"Remove poster\"' src/EventsCreatePage.tsx)" -eq 1

      - name: Commit and remove migration workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/EventsCreatePage.tsx
          git rm .github/workflows/poster-ui-migration.yml
          git commit -m "feat: make event poster selection single and removable"
          git push
