name: BuyMesho CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buymesho-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Git access to private Platform dependency
        env:
          PLATFORM_REPO_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
        run: |
          if [ -z "$PLATFORM_REPO_TOKEN" ]; then
            echo "PLATFORM_REPO_TOKEN GitHub repository secret is not configured or is unavailable to this workflow."
            exit 1
          fi
          git config --global url."https://x-access-token:${PLATFORM_REPO_TOKEN}@github.com/Xhovile/Platform.git".insteadOf "ssh://git@github.com/Xhovile/Platform.git"
          git config --global url."https://x-access-token:${PLATFORM_REPO_TOKEN}@github.com/Xhovile/Platform.git".insteadOf "git@github.com:Xhovile/Platform.git"
          echo "Verifying authenticated access to Xhovile/Platform..."
          git ls-remote ssh://git@github.com/Xhovile/Platform.git HEAD >/dev/null
          echo "Private Platform dependency access verified."

      - name: Sync npm lockfile metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify test database secret is configured
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "TEST_DATABASE_URL GitHub repository secret is not configured or is unavailable to this workflow."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Prepare isolated test database
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: node --import tsx --import ./server/testSafety.ts ./server/testDatabaseBootstrap.ts

      - name: Integration and financial integrity tests
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: npm run test

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
