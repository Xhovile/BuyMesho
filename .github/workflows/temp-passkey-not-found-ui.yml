name: Temporary Passkey Not Found UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'Apply passkey not found UI fix' && github.event.head_commit.message != 'Remove temporary passkey not found UI workflow' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/LoginPage.tsx')
          text = p.read_text()
          old = '''      showFeedback("error", "Passkey sign-in failed", message, [\n        {\n          label: "Reload",\n          onClick: () => window.location.reload(),\n        },\n      ]);'''
          new = '''      if (err?.status === 404 && err?.code === "PASSKEY_NOT_FOUND") {\n        showFeedback(\n          "info",\n          "Passkey no longer available",\n          "This passkey was removed from BuyMesho. Reload the page and choose an available passkey.",\n          [\n            {\n              label: "Reload",\n              onClick: () => window.location.reload(),\n            },\n          ],\n        );\n        return;\n      }\n\n      showFeedback("error", "Passkey sign-in failed", message, [\n        {\n          label: "Reload",\n          onClick: () => window.location.reload(),\n        },\n      ]);'''
          if old not in text:
              raise SystemExit('Passkey error block not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/LoginPage.tsx
          git commit -m "Apply passkey not found UI fix"
          git push
