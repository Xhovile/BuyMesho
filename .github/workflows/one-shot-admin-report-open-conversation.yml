name: One-shot Reports Open Conversation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add Open Conversation to chat reports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/AdminReportsPage.tsx')
          s = p.read_text()
          start = s.index('function MessageReportCard(')
          end = s.index('function ContentReportCard(')
          segment = s[start:end]
          marker = '        <div className="flex flex-col gap-2 min-w-[180px]">'
          pos = segment.find(marker)
          if pos < 0:
              raise SystemExit('Chat report action container not found')
          if 'Open Conversation' not in segment:
              insert_at = start + pos + len(marker)
              insertion = '''\n          {report.conversation_id != null ? (\n            <button\n              type="button"\n              onClick={() => navigateToPath(`/admin/messages?conversation=${report.conversation_id}`)}\n              className="px-4 py-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-white text-sm font-bold"\n            >\n              Open Conversation\n            </button>\n          ) : null}\n'''
              s = s[:insert_at] + insertion + s[insert_at:]
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/AdminReportsPage.tsx
          git commit -m 'Add Open Conversation to chat reports'
          git push origin main
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/one-shot-admin-report-open-conversation.yml
          git add .github/workflows/one-shot-admin-report-open-conversation.yml
          git commit -m 'Remove temporary report conversation workflow' || true
          git push origin main || true
