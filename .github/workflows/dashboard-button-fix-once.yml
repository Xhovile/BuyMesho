name: Dashboard Button Fix Once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove dashboard My Listings action
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/SellerDashboardPage.tsx')
          text = path.read_text()
          old = '''              <button
                type="button"
                onClick={() => navigateToPath("/my-listings")}
                className="inline-flex items-center gap-2 rounded-2xl bg-zinc-900 px-4 py-2.5 text-sm font-extrabold text-white shadow-sm hover:bg-zinc-800"
              >
                <ArrowRight className="h-4 w-4" />
                My Listings
              </button>
'''
          if old not in text:
              raise SystemExit('Expected My Listings dashboard button not found')
          text = text.replace(old, '', 1)
          text = text.replace('import { ArrowRight, BarChart3, Eye, Loader2, MapPin, RefreshCw, TrendingUp, Users, Wallet } from "lucide-react";', 'import { BarChart3, Eye, Loader2, MapPin, RefreshCw, TrendingUp, Users, Wallet } from "lucide-react";', 1)
          path.write_text(text)
          PY

      - name: Commit and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/dashboard-button-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SellerDashboardPage.tsx .github/workflows/dashboard-button-fix-once.yml
          git commit -m "Remove My Listings action from seller dashboard [skip ci]"
          git push origin HEAD:main

# trigger follow-up run
