name: One-shot Admin Messages route

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire Admin Messages route
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'src/lib/appNavigation.query.ts',
              '  ADMIN_PAYOUT_DESTINATIONS_PATH, ADMIN_PAYOUTS_PATH, ADMIN_PAYMENTS_PATH, ADMIN_REPORTS_PATH,\n',
              '  ADMIN_MESSAGES_PATH, ADMIN_PAYOUT_DESTINATIONS_PATH, ADMIN_PAYOUTS_PATH, ADMIN_PAYMENTS_PATH, ADMIN_REPORTS_PATH,\n',
          )
          replace(
              'src/lib/appNavigation.query.ts',
              '  if(location.pathname===ADMIN_PATH)return"admin"; if(location.pathname===ADMIN_EVENTS_PATH)return"admin_events";',
              '  if(location.pathname===ADMIN_PATH)return"admin"; if(location.pathname===ADMIN_MESSAGES_PATH)return"admin_messages"; if(location.pathname===ADMIN_EVENTS_PATH)return"admin_events";',
          )

          replace(
              'src/RootRouter.tsx',
              '  ADMIN_MODERATION_QUEUE_PATH,\n  ADMIN_SETUP_PATH,',
              '  ADMIN_MESSAGES_PATH,\n  ADMIN_MODERATION_QUEUE_PATH,\n  ADMIN_SETUP_PATH,',
          )
          replace(
              'src/RootRouter.tsx',
              'const AdminHubPage = lazy(() => import("./AdminHubPage"));\n',
              'const AdminHubPage = lazy(() => import("./AdminHubPage"));\nconst AdminMessagesPage = lazy(() => import("./AdminMessagesPage"));\n',
          )
          replace(
              'src/RootRouter.tsx',
              '      "admin",\n      "admin_events",',
              '      "admin",\n      "admin_messages",\n      "admin_events",',
          )
          replace(
              'src/RootRouter.tsx',
              '        ) : route === "admin" ? (\n          <AdminHubPage />\n        ) : route === "admin_events" ? (',
              '        ) : route === "admin" ? (\n          <AdminHubPage />\n        ) : route === "admin_messages" ? (\n          <AdminMessagesPage />\n        ) : route === "admin_events" ? (',
          )
          PY

      - name: Commit and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-admin-messages-route.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/appNavigation.query.ts src/RootRouter.tsx .github/workflows/one-shot-admin-messages-route.yml
          git commit -m "Wire Admin Messages route [skip ci]"
          git push origin HEAD:main
