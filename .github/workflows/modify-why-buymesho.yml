name: Apply Why BuyMesho cards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-homepage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update Homepage cards
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/HomePage.tsx")
          text = path.read_text()
          if "data-why-buymesho-card" in text:
              raise SystemExit("Cards already applied")

          replacements = {
              "01 — Access": '''01 — Access</p>
                    <div data-why-buymesho-card="access" className="mb-4 flex h-[88px] w-full max-w-[230px] -rotate-1 items-center justify-between overflow-hidden rounded-3xl border border-zinc-200 bg-white p-4 shadow-[0_14px_30px_-20px_rgba(0,0,0,0.35)]">
                      <div className="flex h-12 w-12 items-center justify-center rounded-2xl border border-red-900/10 bg-red-50 text-2xl font-black text-red-900">↗</div>
                      <div className="pr-2 text-right">
                        <p className="text-[10px] font-black uppercase tracking-[0.2em] text-zinc-400">ACCESS</p>
                        <p className="mt-1 text-xs font-extrabold text-zinc-900">Open marketplace</p>
                      </div>
                    </div>''',
              "02 — Purpose": '''02 — Purpose</p>
                    <div data-why-buymesho-card="purpose" className="mb-4 flex h-[88px] w-full max-w-[230px] rotate-1 items-center justify-between overflow-hidden rounded-3xl border border-zinc-200 bg-white p-4 shadow-[0_14px_30px_-20px_rgba(0,0,0,0.35)]">
                      <div className="flex h-12 w-12 items-center justify-center rounded-2xl border border-red-900/10 bg-red-50 text-2xl font-black text-red-900">✦</div>
                      <div className="pr-2 text-right">
                        <p className="text-[10px] font-black uppercase tracking-[0.2em] text-zinc-400">PURPOSE</p>
                        <p className="mt-1 text-xs font-extrabold text-zinc-900">Student enterprise</p>
                      </div>
                    </div>''',
              "03 — Structure": '''03 — Structure</p>
                    <div data-why-buymesho-card="structure" className="mb-4 flex h-[88px] w-full max-w-[230px] -rotate-1 items-center justify-between overflow-hidden rounded-3xl border border-zinc-200 bg-white p-4 shadow-[0_14px_30px_-20px_rgba(0,0,0,0.35)]">
                      <div className="flex h-12 w-12 items-center justify-center rounded-2xl border border-red-900/10 bg-red-50 text-2xl font-black text-red-900">≡</div>
                      <div className="pr-2 text-right">
                        <p className="text-[10px] font-black uppercase tracking-[0.2em] text-zinc-400">STRUCTURE</p>
                        <p className="mt-1 text-xs font-extrabold text-zinc-900">Built for commerce</p>
                      </div>
                    </div>''',
          }

          for label, replacement in replacements.items():
              pattern = rf'(<p className="text-\[0\.72rem\].*?">){re.escape(label)}(</p>)'
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Could not locate {label}")

          path.write_text(text)

      - name: Commit Homepage change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/HomePage.tsx
          git commit -m "Implement Why BuyMesho visual cards"
          git push origin main

      - name: Remove temporary workflow
        if: always()
        run: |
          git fetch origin main
          git reset --hard origin/main
          if [ -f .github/workflows/modify-why-buymesho.yml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm .github/workflows/modify-why-buymesho.yml
            git commit -m "Remove temporary homepage update workflow"
            git push origin main
          fi
