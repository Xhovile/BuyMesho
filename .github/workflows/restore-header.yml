name: Restore Header Safely

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ github.event.head_commit.message != 'Restore Header.tsx' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore and apply logout fix
        shell: bash
        run: |
          git fetch origin 907a283c18a4145c89cdd27d8c3c04a1b169e5ef --depth=1
          git checkout 907a283c18a4145c89cdd27d8c3c04a1b169e5ef -- src/components/Header.tsx
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/Header.tsx')
          text = p.read_text()
          old = '      navigateToPath(LOGIN_PATH);'
          new = '      // Force a full document reload so Firebase/WebAuthn/browser credential state is clean before passkey login.\n      window.location.replace(LOGIN_PATH);'
          if old not in text:
              raise SystemExit('Expected logout navigation line was not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Header.tsx
          git commit -m "Restore Header.tsx"
          git push
