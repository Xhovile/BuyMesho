name: Remove remaining payout schema side effects

on:
  push:
    branches:
      - fix/integration-test-failures

permissions:
  contents: write

jobs:
  fix:
    if: github.ref_name == 'fix/integration-test-failures'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/integration-test-failures

      - name: Remove runtime schema side-effect imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('server/modules/payouts/payout.service.execution.async.ts'),
              Path('server/modules/payouts/payout.service.reconciliation.ts'),
          ]
          for path in files:
              text = path.read_text()
              text = text.replace("import './payout.schema.js';\n", '', 1)
              path.write_text(text)
          PY

      - name: Verify no payout runtime side-effect imports remain
        run: |
          ! grep -R "^import './payout.schema.js';$" server/modules/payouts --include='*.ts'

      - name: Commit fix and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add server/modules/payouts/payout.service.execution.async.ts server/modules/payouts/payout.service.reconciliation.ts .github/workflows/remove-payout-schema-sideeffects.yml
          git rm .github/workflows/remove-payout-schema-sideeffects.yml
          git commit -m "fix: remove payout schema initialization from runtime imports"
          git push origin HEAD:fix/integration-test-failures
