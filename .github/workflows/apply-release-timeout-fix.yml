name: Apply release timeout fix

on:
  push:
    branches:
      - fix/integration-test-failures

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/integration-test-failures

      - name: Remove transaction-time schema side effect
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/modules/payouts/payout.repository.ts')
          text = path.read_text()
          line = "import './payout.schema.js';\n"
          if line not in text:
              raise SystemExit('Expected payout schema side-effect import was not found')
          path.write_text(text.replace(line, '', 1))
          PY

      - name: Remove temporary debugging files
        run: |
          rm -f scripts/debug-pg.ts scripts/debug-release-trace.ts scripts/debug-release.ts

      - name: Remove helper workflow
        run: rm -f .github/workflows/apply-release-timeout-fix.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add server/modules/payouts/payout.repository.ts scripts .github/workflows/apply-release-timeout-fix.yml
          git commit -m "fix: avoid payout schema bootstrap inside release transaction"
          git push origin HEAD:fix/integration-test-failures
