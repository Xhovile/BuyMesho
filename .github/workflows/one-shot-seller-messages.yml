name: One-shot seller messages scope

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply seller message scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:160]}')
              p.write_text(text.replace(old, new, count))

          # Seller Management -> Messages uses the existing messages route with a scope query.
          replace_exact(
              'src/SellerHubPage.tsx',
              '  MESSAGES_PATH,\n',
              '  SELLER_MESSAGES_PATH,\n',
          )
          replace_exact(
              'src/SellerHubPage.tsx',
              '    path: MESSAGES_PATH,\n',
              '    path: SELLER_MESSAGES_PATH,\n',
          )

          # Keep the existing MessagesInboxPage, but make its existing inbox request seller-scoped
          # when opened from Seller Management. No new page/component/route is introduced.
          replace_exact(
              'src/MessagesInboxPage.tsx',
              'import { deleteConversation, fetchInbox } from "./lib/messages";\n',
              'import { apiFetch } from "./lib/api";\nimport { deleteConversation, fetchInbox } from "./lib/messages";\n',
          )
          replace_exact(
              'src/MessagesInboxPage.tsx',
              '  const [deleteTarget, setDeleteTarget] = useState<Conversation | null>(null);\n\n  const loadInbox = async () => {\n    const items = await fetchInbox();\n    setInbox(items);\n  };\n',
              '  const [deleteTarget, setDeleteTarget] = useState<Conversation | null>(null);\n  const sellerScope = typeof window !== "undefined" && new URLSearchParams(window.location.search).get("scope") === "seller";\n\n  const fetchScopedInbox = async () => {\n    if (!sellerScope) return fetchInbox();\n    const result = await apiFetch("/api/messages/inbox?scope=seller");\n    const payload = result as { items?: Conversation[] };\n    return Array.isArray(payload.items) ? payload.items : [];\n  };\n\n  const loadInbox = async () => {\n    const items = await fetchScopedInbox();\n    setInbox(items);\n  };\n',
          )
          replace_exact(
              'src/MessagesInboxPage.tsx',
              '        const items = await fetchInbox();\n        if (!cancelled) setInbox(items);\n',
              '        const items = await fetchScopedInbox();\n        if (!cancelled) setInbox(items);\n',
          )
          replace_exact(
              'src/MessagesInboxPage.tsx',
              '  }, [authLoading, user]);\n',
              '  }, [authLoading, user, sellerScope]);\n',
          )

          # Existing messages API: seller scope means listing conversations where the current user
          # is the seller. Buyer inbox behavior remains exactly unchanged.
          p = Path('server/routes/messagesRoutes.ts')
          text = p.read_text()
          old = '''  const rows = db\n    .prepare(\n      `SELECT\n        c.*,\n        l.name AS listing_name,\n        l.price AS listing_price,\n        l.status AS listing_status,\n        l.photos AS listing_photos,\n        l.university AS listing_university,\n        e.event_title AS event_title,\n        e.ticket_price AS event_price,\n        e.status AS event_status,\n        e.location AS event_location,\n        e.event_type AS event_type,\n        e.organizer_name AS organizer_name,\n        sb.business_name AS seller_business_name,\n        sb.business_logo AS seller_logo,\n        sb.is_verified AS seller_is_verified,\n        bb.business_name AS buyer_business_name,\n        bb.business_logo AS buyer_logo,\n        bb.is_verified AS buyer_is_verified\n       FROM conversations c\n       LEFT JOIN listings l ON l.id = c.listing_id\n       LEFT JOIN events e ON e.id = c.event_id\n       LEFT JOIN sellers sb ON sb.uid = c.seller_uid\n       LEFT JOIN sellers bb ON bb.uid = c.buyer_uid\n       WHERE c.buyer_uid = ? OR c.seller_uid = ? OR ? = 1\n       ORDER BY c.updated_at DESC, c.id DESC`\n    )\n    .all(user.uid, user.uid, user.is_admin ? 1 : 0) as ConversationRow[];\n'''
          new = '''  const sellerScope = String(req.query.scope || "").trim().toLowerCase() === "seller";\n  const whereClause = sellerScope\n    ? "c.seller_uid = ? AND c.listing_id IS NOT NULL"\n    : "c.buyer_uid = ? OR c.seller_uid = ? OR ? = 1";\n  const params = sellerScope\n    ? [user.uid]\n    : [user.uid, user.uid, user.is_admin ? 1 : 0];\n\n  const rows = db\n    .prepare(\n      `SELECT\n        c.*,\n        l.name AS listing_name,\n        l.price AS listing_price,\n        l.status AS listing_status,\n        l.photos AS listing_photos,\n        l.university AS listing_university,\n        e.event_title AS event_title,\n        e.ticket_price AS event_price,\n        e.status AS event_status,\n        e.location AS event_location,\n        e.event_type AS event_type,\n        e.organizer_name AS organizer_name,\n        sb.business_name AS seller_business_name,\n        sb.business_logo AS seller_logo,\n        sb.is_verified AS seller_is_verified,\n        bb.business_name AS buyer_business_name,\n        bb.business_logo AS buyer_logo,\n        bb.is_verified AS buyer_is_verified\n       FROM conversations c\n       LEFT JOIN listings l ON l.id = c.listing_id\n       LEFT JOIN events e ON e.id = c.event_id\n       LEFT JOIN sellers sb ON sb.uid = c.seller_uid\n       LEFT JOIN sellers bb ON bb.uid = c.buyer_uid\n       WHERE ${whereClause}\n       ORDER BY c.updated_at DESC, c.id DESC`\n    )\n    .all(...params) as ConversationRow[];\n'''
          if old not in text:
              raise SystemExit('Seller inbox query block not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-seller-messages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SellerHubPage.tsx src/MessagesInboxPage.tsx server/routes/messagesRoutes.ts .github/workflows/one-shot-seller-messages.yml
          git commit -m "Add seller-scoped inbox filtering [skip ci]"
          git push origin HEAD:main
