name: Remove payout schema side-effect imports

on:
  push:
    branches:
      - fix/integration-test-failures

permissions:
  contents: write

jobs:
  fix:
    if: github.ref_name == 'fix/integration-test-failures'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/integration-test-failures
          fetch-depth: 0

      - name: Remove runtime schema side effects
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('server/modules/payouts/payout.service.core.ts'),
              Path('server/modules/payouts/payout.service.execution.async.ts'),
              Path('server/modules/payouts/payout.service.reconciliation.ts'),
          ]
          for path in files:
              text = path.read_text()
              text = text.replace("import './payout.schema.js';\n", "", 1)
              path.write_text(text)
          PY
          git diff --check

      - name: Run targeted tests
        run: |
          NODE_ENV=test node --import tsx --import ./server/testSafety.ts \
            ./server/routes/escrow/__tests__/release.test.ts \
            ./server/routes/escrow/__tests__/release.audit.test.ts

      - name: Commit and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/modules/payouts/payout.service.core.ts \
                  server/modules/payouts/payout.service.execution.async.ts \
                  server/modules/payouts/payout.service.reconciliation.ts \
                  .github/workflows/fix-payout-schema-sideeffects.yml
          git rm .github/workflows/fix-payout-schema-sideeffects.yml
          git commit -m "fix: prevent payout schema initialization inside release transaction"
          git push origin HEAD:fix/integration-test-failures
