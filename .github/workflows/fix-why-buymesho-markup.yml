name: Fix Why BuyMesho markup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair labels
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/HomePage.tsx")
          text = path.read_text()
          replacements = {
            '                  01 — Access</p>': '                  <p className="text-[0.72rem] font-bold uppercase tracking-[0.18em] text-zinc-400">01 — Access</p>',
            '                    02 — Purpose</p>': '                    <p className="text-[0.72rem] font-bold uppercase tracking-[0.18em] text-zinc-400">02 — Purpose</p>',
            '                    03 — Structure</p>': '                    <p className="text-[0.72rem] font-bold uppercase tracking-[0.18em] text-zinc-400">03 — Structure</p>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Missing expected text: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/HomePage.tsx
          git commit -m "Fix Why BuyMesho card markup"
          git push origin main

      - name: Remove temporary workflow
        if: always()
        run: |
          git fetch origin main
          git reset --hard origin/main
          if [ -f .github/workflows/fix-why-buymesho-markup.yml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm .github/workflows/fix-why-buymesho-markup.yml
            git commit -m "Remove temporary markup fix workflow"
            git push origin main
          fi
