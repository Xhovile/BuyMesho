name: One-shot Admin Messages auth fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update Admin Messages to use apiFetch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/AdminMessagesPage.tsx')
          s = p.read_text()
          if 'import { apiFetch } from "./lib/api";' not in s:
              s = s.replace('import { navigateToPath } from "./lib/appNavigation";\n', 'import { navigateToPath } from "./lib/appNavigation";\nimport { apiFetch } from "./lib/api";\n', 1)
          s = s.replace('const response = await fetch(`/api/admin/messages?${params.toString()}`, { signal: controller.signal, credentials: "include" });\n        const payload = await response.json().catch(() => null);\n        if (!response.ok) throw new Error(payload?.error || "Failed to load admin messages.");', 'const payload = await apiFetch(`/api/admin/messages?${params.toString()}`, { signal: controller.signal });')
          s = s.replace('const response = await fetch("/api/admin/messages/summary", { credentials: "include" });\n        const payload = await response.json().catch(() => null);\n        if (response.ok) setSummary({ unread: Number(payload?.unread || 0), reported: Number(payload?.reported || 0), blocked: Number(payload?.blocked || 0) });', 'const payload = await apiFetch("/api/admin/messages/summary");\n        setSummary({ unread: Number(payload?.unread || 0), reported: Number(payload?.reported || 0), blocked: Number(payload?.blocked || 0) });')
          s = s.replace('const response = await fetch(`/api/admin/messages?${params.toString()}`, { credentials: "include" });\n      const payload = await response.json().catch(() => null);\n      if (!response.ok) throw new Error(payload?.error || "Failed to load next page.");', 'const payload = await apiFetch(`/api/admin/messages?${params.toString()}`);')
          p.write_text(s)

          p = Path('src/AdminMessageThreadPage.tsx')
          s = p.read_text()
          if 'import { apiFetch } from "./lib/api";' not in s:
              s = s.replace('import { navigateToPath } from "./lib/appNavigation";\n', 'import { navigateToPath } from "./lib/appNavigation";\nimport { apiFetch } from "./lib/api";\n', 1)
          old = 'const response = await fetch(`/api/admin/messages/${conversationId}`, { credentials: "include" });\n      const payload = await response.json().catch(() => null);\n      if (!response.ok) throw new Error(payload?.error || "Failed to load conversation.");\n      setData(payload as ThreadData);\n      const review = await fetch(`/api/admin/messages/${conversationId}/review`, { method:"POST", credentials:"include" });\n      if (!review.ok) { const reviewPayload = await review.json().catch(() => null); throw new Error(reviewPayload?.error || "Conversation loaded, but admin review state could not be saved."); }'
          new = 'const payload = await apiFetch(`/api/admin/messages/${conversationId}`);\n      setData(payload as ThreadData);\n      await apiFetch(`/api/admin/messages/${conversationId}/review`, { method: "POST" });'
          if old in s:
              s = s.replace(old, new, 1)
          old = 'const response = await fetch(`/api/admin/messages/${conversationId}/action`, { method:"POST", headers:{"Content-Type":"application/json"}, credentials:"include", body:JSON.stringify({ action, target_uid:targetUid, report_id:reportId, resolution:resolution.trim() || undefined }) });\n      const payload = await response.json().catch(() => null);\n      if (!response.ok) throw new Error(payload?.error || "Moderation action failed.");'
          new = 'await apiFetch(`/api/admin/messages/${conversationId}/action`, { method: "POST", body: JSON.stringify({ action, target_uid: targetUid, report_id: reportId, resolution: resolution.trim() || undefined }) });'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/AdminMessagesPage.tsx src/AdminMessageThreadPage.tsx
          git commit -m 'Fix Admin Messages authentication and timeout handling'
          git push origin main
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/one-shot-admin-messages-auth.yml
          git add .github/workflows/one-shot-admin-messages-auth.yml
          git commit -m 'Remove temporary admin messages auth workflow' || true
          git push origin main || true
