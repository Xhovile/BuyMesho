name: Fix My Listings hub removal

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove stale hub dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/MyListingsPage.tsx')
          text = p.read_text()
          text = text.replace('import MyListingsHubPage from "./MyListingsHubPage";\n', '')
          text = text.replace('  const view = new URLSearchParams(window.location.search).get("view");\n  if (view !== "listings") return <MyListingsHubPage />;\n\n', '')
          p.write_text(text)
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-my-listings-hub-removal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MyListingsPage.tsx .github/workflows/fix-my-listings-hub-removal.yml
          git commit -m "Remove stale My Listings hub dependency [skip ci]"
          git push origin HEAD:main
