name: Temporary Security Type Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply shared type fix
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/lib/security.ts')
          text = path.read_text()
          old = '  | { ok: true; message?: string }'
          new = '  | { ok: true; message?: string; code?: string }'
          if old not in text:
              raise SystemExit('Expected SecurityResult success variant not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/temporary-security-type-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/security.ts .github/workflows/temporary-security-type-fix.yml
          git commit -m "Fix SecurityResult type contract"
          git push origin HEAD:main
