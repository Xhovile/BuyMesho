name: Apply Two Event Click Fixes

on:
  push:
    branches:
      - fix/event-card-checkout-fullscreen

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply exactly two fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          strip = Path("src/components/home/EventsStrip.tsx")
          text = strip.read_text()
          old = 'className="flex min-w-[6.5rem] items-center justify-center border-l border-orange-200 bg-white px-4 py-3 text-sm font-black tracking-tight text-zinc-950">'
          new = 'className="pointer-events-none flex min-w-[6.5rem] items-center justify-center border-l border-orange-200 bg-white px-4 py-3 text-sm font-black tracking-tight text-zinc-950">'
          if text.count(old) != 1:
              raise SystemExit("EventsStrip target not found exactly once")
          strip.write_text(text.replace(old, new, 1))

          details = Path("src/components/eventDetails/EventDetailsView.tsx")
          text = details.read_text()
          old = 'navigateToLoginWithReturnPath(eventPageUrl || `${EVENTS_PATH}?event=${event.id}`);'
          new = 'navigateToLoginWithReturnPath(\n        autoBuyRequested ? `${eventPageUrl}&buy=1` : eventPageUrl || `${EVENTS_PATH}?event=${event.id}`\n      );'
          if text.count(old) != 1:
              raise SystemExit("EventDetailsView target not found exactly once")
          details.write_text(text.replace(old, new, 1))
          PY

      - name: Validate only the intended changes exist
        run: |
          grep -q 'pointer-events-none flex min-w-\[6.5rem\]' src/components/home/EventsStrip.tsx
          grep -q 'autoBuyRequested ? `${eventPageUrl}&buy=1`' src/components/eventDetails/EventDetailsView.tsx

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/home/EventsStrip.tsx src/components/eventDetails/EventDetailsView.tsx .github/workflows/fix-two-event-click-issues.yml
          git rm .github/workflows/fix-two-event-click-issues.yml
          git commit -m "fix: complete event card click behavior"
          git push