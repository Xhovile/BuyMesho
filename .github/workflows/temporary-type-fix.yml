name: Temporary Type Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted type fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              'server/diagnostics/legacy.core.ts': [
                  (
                      '      const row = result.rows[0] ?? {};',
                      '      const row = result.rows[0] ?? {\n        released_balance_nonzero: "0",\n        refunded_balance_nonzero: "0",\n        released_missing_entry: "0",\n        refunded_missing_entry: "0",\n        terminal_conflict: "0",\n      };',
                  )
              ],
              'server/routes/diagnostics.core.ts': [
                  (
                      '      const row = result.rows[0] ?? {};',
                      '      const row = result.rows[0] ?? {\n        released_balance_nonzero: "0",\n        refunded_balance_nonzero: "0",\n        released_missing_entry: "0",\n        refunded_missing_entry: "0",\n        terminal_conflict: "0",\n      };',
                  )
              ],
              'src/VerifyEmailPage.tsx': [
                  (
                      '      if (result.code === "auth/too-many-requests" || result.message.toLowerCase().includes("too many attempts")) {',
                      '      if (!result.ok && (result.code === "auth/too-many-requests" || result.message.toLowerCase().includes("too many attempts"))) {',
                  )
              ],
              'src/components/ai/BuyMeshoCopilotDrawer.tsx': [
                  (
                      'import { queryShoppingAssistant, type ShoppingAssistantResult, type ShoppingAssistantListing } from "../../lib/ai";',
                      'import { queryShoppingAssistant, type ShoppingAssistantResult, type ShoppingAssistantListing, type CopilotConversationMessage } from "../../lib/ai";',
                  )
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {filename}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text)
              if text == original:
                  raise SystemExit(f"No change made to {filename}")
          PY

      - name: Commit fixes and remove temporary workflow
        run: |
          rm .github/workflows/temporary-type-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/diagnostics/legacy.core.ts server/routes/diagnostics.core.ts src/VerifyEmailPage.tsx src/components/ai/BuyMeshoCopilotDrawer.tsx .github/workflows/temporary-type-fix.yml
          git commit -m "Fix remaining CI type errors [skip ci]"
          git push origin HEAD:main
